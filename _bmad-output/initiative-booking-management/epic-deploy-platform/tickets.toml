# tickets.toml — epic-deploy-platform's agreed stories, in build order (DRAFT, 2026-10-11, awaiting the developer's approval).
# Two lanes after the tracer: the backend lane (2, 3, 5, 6, 7, 8) and the delivery lane (1, 9, 10, 11).

[[entry]]
id = 1
type = "story"
title = "The health page is live on the demo environment"
description = "Adds the API's Dockerfile (runtime image with tzdata and ICU for IANA zones) and render.yaml (a Render Blueprint in the Singapore region: Docker web service plus static site that rewrites /api/* to it, free plans, autoDeploy off, healthCheckPath /health/ready), a MongoDB readiness check on /health/ready, and moves the Angular page to /api/health; the developer then creates the services from the Blueprint and enters the secrets."
verify = "After the developer applies the Blueprint, the page at the static site's HTTPS address shows the API healthy through the /api rewrite, and /health/ready reports MongoDB connected."
covers = []
after = ["0.1"]
hitl = true
risk = "high"
references = ["architecture-slotbook/architecture-slotbook.md#ad-18", "architecture-slotbook/architecture-slotbook.md#ad-17"]
notes = ["Secrets and tenant values are never in render.yaml: ConnectionStrings__mongodb and the Tenancy__Tenant__* variables are declared with sync: false so the developer enters them in Render. ASPNETCORE_ENVIRONMENT=Demo.", "Atlas M0 is in AWS Singapore (ap-southeast-1); Render services use region singapore.", "The /api rewrite proof (POST bodies, Set-Cookie, client IP) is story 10's; if it fails, the free fallback is the API serving the Angular build from wwwroot."]
plan_checkpoint = true

[[entry]]
id = 2
type = "story"
title = "The backend has its project layout and error format"
description = "Lays out the four SharedKernel projects, ServiceDefaults, the integration-test and SharedKernel test projects per AD-2 and AD-19, with RFC 9457 problem-details errors (DomainException, CommonErrors) and the W3C trace id on every log line."
verify = "dotnet test passes, and a request to a deliberately failing action returns an RFC 9457 body with a code and traceId and a log line with the same trace id."
covers = []
after = ["0.1", "0.3"]
hitl = false
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-2", "architecture-slotbook/architecture-slotbook.md#ad-13", "architecture-slotbook/architecture-slotbook.md#ad-17"]
plan_checkpoint = true

[[entry]]
id = 13
type = "story"
title = "Commands and queries go through the dispatcher and its validators"
description = "Adds ICommand and IQuery, our own dispatcher with assembly scanning, FluentValidation validators run first with a code map, Result, and the 400 and 422 mappings."
verify = "A command with an invalid field returns 400 validation_failed with errors.{field} codes and its handler never runs; a Result.Refused returns 422 with its code."
covers = []
after = [2]
hitl = false
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-4", "architecture-slotbook/architecture-slotbook.md#ad-13"]

[[entry]]
id = 14
type = "story"
title = "The clock, the configured tenant and readiness"
description = "Adds IClock on TimeProvider, the Tenancy:Tenant options validated on start with a UUID derived from the slug as ITenantContext, and the /api/health and /health/ready endpoints."
verify = "Startup fails when Tenancy:Tenant is missing, ITenantContext returns the configured tenant, and /health, /api/health and /health/ready answer 200."
covers = []
after = [2]
hitl = false
risk = "low"
references = ["architecture-slotbook/architecture-slotbook.md#ad-5", "architecture-slotbook/architecture-slotbook.md#ad-14"]

[[entry]]
id = 3
type = "story"
title = "Architecture rules fail the build"
description = "Adds the ArchitectureTests project (ArchUnitNET) and BannedApiAnalyzers with the AD-19 inventory rules that exist at this point: layer and reference direction, no public setters, no tenant parameters, banned time APIs and Guid.NewGuid."
verify = "A deliberate violation of each rule fails the build or the architecture tests with the rule's name."
covers = []
after = [13, 14]
hitl = false
risk = "low"
references = ["architecture-slotbook/architecture-slotbook.md#ad-19"]

[[entry]]
id = 4
type = "story"
title = "Integration tests run against a real MongoDB replica set and RabbitMQ"
description = "Adds MongoDB (single-node replica set) and RabbitMQ as CI service containers, matching the sandbox sidecars already in sandbox/run-job.sh, and a test harness that reads ConnectionStrings__mongodb and ConnectionStrings__rabbitmq and gives each test class its own database."
verify = "An integration test that writes a document in a multi-document transaction and publishes a message passes in the sandbox and in CI."
covers = []
after = [2, "0.2"]
hitl = false
risk = "medium"
notes = ["The sandbox sidecars are done on the host (fae9037): mongo:8.0 --replSet rs0 as host mongo, rabbitmq:4-alpine as host rabbitmq; the sandbox gets ConnectionStrings__mongodb=mongodb://mongo:27017/?replicaSet=rs0 and ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672/. CI must use the same images and the same variable names."]
references = ["architecture-slotbook/architecture-slotbook.md#ad-19"]

[[entry]]
id = 5
type = "story"
title = "Aggregates save through a tenant-filtered, version-checked unit of work"
description = "Story 5a of the #24 plan: the aggregate base, TenantAggregateRoot and [GlobalAggregate], DeterministicId.ForGuard, BSON conventions, the Mongo:Database setting, TenantCollection (the tenant filter and stamp), the write repository base, and the unit of work that commits every aggregate loaded through a write repository with a version-checked save in one transaction (majority, snapshot); plus the AD-5 architecture rules for unfiltered collections and aggregate tenancy."
verify = "A handler's two writes commit together or not at all, a stale version is refused, another tenant's document is invisible and never overwritten, and each AD-5 fixture fails with its rule name."
covers = []
after = [4]
hitl = false
risk = "high"
references = ["architecture-slotbook/architecture-slotbook.md#ad-5", "architecture-slotbook/architecture-slotbook.md#ad-7", "architecture-slotbook/architecture-slotbook.md#ad-9"]
notes = ['Plan: the approved plan on #24 (issue comment), split into 5a/5b/5c; build only this part, with the review answers in the approval comment.']
plan_checkpoint = false

[[entry]]
id = 15
type = "story"
title = "Conflicting writes re-run the handler within 3 s"
description = "Story 5b of the #24 plan: the ICommandExecution seam in the dispatcher (fresh scope per attempt, nested public commands join the outer attempt), the write-error classifier, the whole-handler retry with jittered backoff and the commit-only retry on an unknown commit result, all within a 3 s TimeProvider budget, concurrency_conflict mapped to 409, and a test-only keyed guard sample."
verify = "A concurrency test with 50 parallel writers to one guard document ends with exact counts and zero 409s, and a first-use race on a keyed guard creates one document."
covers = []
after = [5]
hitl = false
risk = "high"
references = ["architecture-slotbook/architecture-slotbook.md#ad-6", "architecture-slotbook/architecture-slotbook.md#ad-7", "architecture-slotbook/architecture-slotbook.md#ad-8"]
notes = ['Plan: the approved plan on #24 (issue comment), split into 5a/5b/5c; build only this part, with the review answers in the approval comment.']
plan_checkpoint = false

[[entry]]
id = 16
type = "story"
title = "Indexes and migrations apply at startup under an expiring lock"
description = "Story 5c of the #24 plan: one index configuration per aggregate, a blocking schema initializer (create collections, run migrations, then create indexes; about 60 s startup timeout), and the migrations runner recorded in migrations under an expiring lock document in leases, in a minimal shape that story 7's job runner extends."
verify = "Indexes exist after startup and a restart is a no-op; two hosts starting together apply each migration once, in order; an expired lock does not block startup."
covers = []
after = [5]
hitl = false
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-9", "architecture-slotbook/architecture-slotbook.md#ad-11"]
notes = ['Plan: the approved plan on #24 (issue comment), split into 5a/5b/5c; build only this part, with the review answers in the approval comment.']
plan_checkpoint = false

[[entry]]
id = 6
type = "story"
title = "Integration events leave through the outbox and arrive through the inbox"
description = "Adds AddSlotBookMessaging with MassTransit 8.5.11, the MongoDB bus outbox on the unit of work's session, the inbox in consumers sharing the consume context's session, the consumer retry rules and the event serialization round-trip test."
verify = "A test commits an aggregate and an event in one transaction, the consumer runs once, and a crash after the handler does not run it twice."
covers = []
after = [15]
hitl = false
risk = "high"
references = ["architecture-slotbook/architecture-slotbook.md#ad-10"]
plan_checkpoint = true

[[entry]]
id = 7
type = "story"
title = "Timed jobs run on a lease and catch up"
description = "Builds the lease-based job runner with expiring, renewed leases and a catch-up sample job that processes everything due, plus the /internal/jobs endpoint seam kept off until needed."
verify = "Two hosts run the sample job and only one holds the lease; stopping the host for a minute and restarting it processes every missed tick."
covers = []
after = [16]
hitl = false
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-11"]

[[entry]]
id = 8
type = "story"
title = "Cookies, CSRF and security headers are set up"
description = "Persists Data Protection keys in MongoDB, adds antiforgery with Angular's XSRF header, the two authentication schemes' skeleton and the endpoint-access fitness test, the CSP and HSTS headers in render.yaml, and the OpenAPI document generated and checked in CI."
verify = "An XSRF token issued before a host restart is accepted after it, and CI fails when openapi.json is stale."
covers = []
after = [2, 5]
hitl = false
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-12", "architecture-slotbook/architecture-slotbook.md#ad-13"]

[[entry]]
id = 9
type = "story"
title = "A merge to main deploys the demo environment"
description = "Adds deploy.yml: after ci succeeds on main it calls the Render deploy hooks by changed path, deploys the API first, waits until /health/ready reports the new commit SHA, then deploys the static site, with Render auto-deploy off."
verify = "Merging a change deploys it with no manual step, and a deliberately broken readiness check leaves the previous version running."
covers = []
after = [1]
hitl = true
risk = "medium"
references = ["architecture-slotbook/architecture-slotbook.md#ad-18"]

[[entry]]
