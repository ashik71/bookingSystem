# tickets.toml — the initiative's epics in build order (sliced from the final PRD in session 009, 2026-10-10).
# `release` is a house key that tickets.py ignores: "go-live" epics ship before the clinic's first real booking,
# "fast-follow" epics ship to production after it. Epic 10 is the go-live line.
# Every epic's inception also waits on the architecture spine and, for epics with screens, on the UX documents.

[[epic]]
id = 0
slug = "epic-walking-skeleton"
title = "Walking skeleton: the web page shows the API's health, checked by CI"
covers = []
release = "go-live"

[[epic]]
id = 1
slug = "epic-deploy-platform"
title = "SlotBook deploys to Render on every merge"
covers = []
release = "go-live"
after = [{ epic = 0, needs = "the solution scaffold, test commands and CI workflow" }]

[[epic]]
id = 2
slug = "epic-tenant-and-staff"
title = "Owners run their tenant: staff, settings, audit log and alerts"
covers = ["FR-38", "FR-39", "FR-42", "FR-45", "FR-43"]
release = "go-live"
after = [{ epic = 1, needs = "the deploy pipeline, the MongoDB database, and database-backed tests in CI" }]

[[epic]]
id = 3
slug = "epic-schedule-and-publication"
title = "Owners publish the week; anyone sees what is bookable"
covers = ["FR-7", "FR-8", "FR-9", "FR-10", "FR-11"]
release = "go-live"
after = [{ epic = 2, needs = "staff sessions and roles, tenant settings (time zone, week start, publication day), the audit-entry API, the language catalogue" }]

[[epic]]
id = 4
slug = "epic-patient-sign-in"
title = "Patients sign in with their mobile number"
covers = ["FR-1", "FR-2", "FR-3", "FR-4", "FR-5", "FR-6", "FR-27"]
release = "go-live"
after = [
  { epic = 2, needs = "tenant settings (country, daily OTP budget, privacy notice), the owner-alert API, the audit-entry API" },
  { epic = 3, needs = "the rate limiter, the scheduler, the patient web shell" },
]

[[epic]]
id = 5
slug = "epic-booking-core"
title = "Patients book a free place and hold a ticket"
covers = ["FR-15", "FR-16", "FR-17", "FR-18", "FR-19", "FR-21", "FR-22", "FR-23"]
release = "go-live"
after = [
  { epic = 2, needs = "booking limits, cancellation cut-off, reason categories, ticket code prefix, the owner-alert API" },
  { epic = 3, needs = "published slots with capacity, reserved and taken counts, and the scheduler" },
  { epic = 4, needs = "patient sessions and the patient record" },
]

[[epic]]
id = 6
slug = "epic-notifications"
title = "Patients are told about every change to their booking"
covers = ["FR-27", "FR-28", "FR-29"]
release = "go-live"
after = [
  { epic = 2, needs = "the owner-alert API and the reminder lead-time setting" },
  { epic = 3, needs = "the scheduler" },
  { epic = 4, needs = "the SMS channel interface, the development channel, the patient's stored language" },
  { epic = 5, needs = "booking events (confirmed; cancelled with actor, reason and notify flag) written to the outbox" },
]

[[epic]]
id = 7
slug = "epic-clinic-day"
title = "Practitioners run their day: who is coming, who is genuine"
covers = ["FR-11", "FR-20", "FR-21", "FR-24", "FR-25", "FR-40", "FR-41"]
release = "go-live"
after = [
  { epic = 3, needs = "slot closing, and the rate limiter" },
  { epic = 4, needs = "the revoke-all-sessions function" },
  { epic = 5, needs = "bookings with origin and kind of place, the lifecycle rule, ticket-code storage" },
  { epic = 6, needs = "sending of clinic-cancel notifications" },
]

[[epic]]
id = 8
slug = "epic-reserved-places"
title = "Practitioners keep places for phone, walk-in and missed patients"
covers = ["FR-12", "FR-13", "FR-14"]
release = "go-live"
after = [
  { epic = 5, needs = "the booking transaction, the capacity predicate, and the origin and kind-of-place fields" },
  { epic = 6, needs = "confirmation notifications" },
  { epic = 7, needs = "serialised changes to the Booking aggregate's transitions" },
]

[[epic]]
id = 9
slug = "epic-anti-impersonation"
title = "Patients can tell the real clinic from an impersonator"
covers = ["FR-26", "FR-30", "FR-31", "FR-32"]
release = "go-live"
after = [
  { epic = 3, needs = "the home page and the rate limiter" },
  { epic = 4, needs = "patient sessions" },
  { epic = 5, needs = "the ticket page" },
  { epic = 7, needs = "the FR-24 lookup rule and code matching as a reusable query" },
  { epic = 8, needs = "serialised changes to staff navigation and the audit action list" },
]

[[epic]]
id = 10
slug = "epic-launch"
title = "The first clinic goes live, with patients' privacy rights in place"
covers = ["FR-44", "FR-43"]
release = "go-live"
after = [{ epic = 9, needs = "every go-live epic (1 to 9) done; the epic file gates on each" }]

[[epic]]
id = 11
slug = "epic-announcements"
title = "Owners post announcements and notify affected patients"
covers = ["FR-33"]
release = "fast-follow"
after = [
  { epic = 3, needs = "the home page" },
  { epic = 6, needs = "the notification pipeline with priority classes" },
  { epic = 10, needs = "production" },
]

[[epic]]
id = 12
slug = "epic-chat"
title = "Patients and the clinic talk in one conversation"
covers = ["FR-34", "FR-35", "FR-36", "FR-37"]
release = "fast-follow"
after = [
  { epic = 3, needs = "the rate limiter and the home page" },
  { epic = 6, needs = "push notifications" },
  { epic = 10, needs = "production, and FR-44 deletion to extend to conversation text" },
  { epic = 11, needs = "serialised changes to the patient home page" },
]
