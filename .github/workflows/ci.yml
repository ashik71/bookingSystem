# Builds and tests the side(s) a change touches. `ci-ok` always runs and is the one check
# `main` requires. No `paths:` filter on the triggers: a skipped workflow never reports,
# so a required check would hang. Path rules: .github/scripts/ci-changes.sh.
# Test commands are those of docs/adr/0006-monorepo-layout-and-test-stack.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel runs on main

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the CI scripts
        run: |
          set -euo pipefail
          .github/scripts/ci-changes.test.sh
          .github/scripts/ci-aggregate.test.sh
      - name: Detect changed sides
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ $EVENT == pull_request ]]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | .github/scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'backend=true\nfrontend=true\n' >> "$GITHUB_OUTPUT"   # main: always check both sides
          fi
          cat "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same images as the sandbox sidecars (sandbox/run-job.sh: MONGO_IMAGE, RABBIT_IMAGE).
    # MongoDB is started by a step below: a service container can't take `--replSet rs0`.
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Start MongoDB replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec -e HOME=/tmp mongo mongosh --quiet --eval \
                'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}).ok }' \
                >/dev/null 2>&1 \
              && docker exec -e HOME=/tmp mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become ready" >&2
          docker logs mongo >&2
          exit 1
      - name: Build
        run: dotnet build
      - name: Test
        env:
          ConnectionStrings__mongodb: mongodb://localhost:27017/?replicaSet=rs0
          ConnectionStrings__rabbitmq: amqp://guest:guest@localhost:5672/
        run: dotnet test
      - name: Build the API image
        run: docker build -f src/backend/Dockerfile -t slotbook-api:ci .
      - name: Smoke-test the API image
        # Host network so the container reaches the MongoDB started above on localhost:27017.
        # A valid IANA time zone also proves tzdata and ICU are in the image.
        run: |
          set -euo pipefail
          docker run -d --name api --network host \
            -e ASPNETCORE_ENVIRONMENT=Demo \
            -e ConnectionStrings__mongodb='mongodb://localhost:27017/?replicaSet=rs0' \
            -e ConnectionStrings__rabbitmq='amqp://guest:guest@localhost:5672/' \
            -e Tenancy__Tenant__Slug=smoke-clinic \
            -e Tenancy__Tenant__DisplayName='Smoke Clinic' \
            -e Tenancy__Tenant__Country=AU \
            -e Tenancy__Tenant__TimeZone=Australia/Sydney \
            -e Tenancy__Tenant__WeekStartDay=Monday \
            slotbook-api:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8080/health/ready 2>/dev/null); then
              echo "$body"
              [[ $body == *'"mongodb":"Healthy"'* ]] && exit 0
            fi
            sleep 2
          done
          echo "API image did not report MongoDB healthy" >&2
          docker logs api >&2
          exit 1

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  ci-ok:
    name: ci-ok
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: .github/scripts/ci-aggregate.sh
